version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: medsafe_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medsafe_user
      POSTGRES_PASSWORD: medsafe_password
      POSTGRES_DB: medsafe_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsafe_user -d medsafe_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (optional — for rate limiting & caching)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: medsafe_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MedSafe AI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medsafe_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://medsafe_user:medsafe_password@db:5432/medsafe_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/data/uploads
      - chroma_data:/app/data/chroma
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  uploads_data:
  chroma_data:
